</style></head><body><header><h1>QUILMES CONECTADO</h1><p>Revista comercial · Edición de prueba</p></header><main><div class="sheet" id="sheet"></div><div id="readerBar"><button id="prev" aria-label="Página anterior">‹</button><span id="counter" aria-live="polite">Cargando…</span><button id="next" aria-label="Página siguiente">›</button><button id="sound" aria-pressed="true" aria-label="Sonido de página">Sonido</button></div><p class="hint">Deslizá para cambiar de hoja. Tocá una publicidad para ampliarla.</p></main><footer>25 hojas · 150 espacios publicitarios</footer><div id="modal" role="dialog" aria-modal="true" aria-label="Publicidad ampliada"><div id="zoom"></div><button id="close">Cerrar</button></div><script>
'use strict';let TOTAL=0;const PER_PAGE=6;let layouts={};let current=0;let cover=null;const sheet=document.getElementById('sheet'),modal=document.getElementById('modal'),zoom=document.getElementById('zoom');

let editionKey=null;async function cargarPublicidades(){try{const files=await Promise.all(['anuncios.json','borrador.json'].map(async path=>{const res=await fetch('./'+path,{cache:'no-store'});if(res.status===404&&path==='borrador.json')return null;if(!res.ok)throw Error('No se pudo cargar '+path);return {path,m:await res.json(),date:Date.parse(res.headers.get('date')||'')}}));const now=Number.isFinite(files[0].date)?files[0].date:Date.now();const due=files.filter(x=>x&&x.m._publishAt&&Date.parse(x.m._publishAt)<=now).sort((a,b)=>Date.parse(b.m._publishAt)-Date.parse(a.m._publishAt));const selected=due[0]||files[0],datos=selected.m,key=selected.path+JSON.stringify(datos);if(key===editionKey)return;editionKey=key;TOTAL=Math.max(1,Number(datos._pages)||25);layouts=datos._layouts||{};cover=readCover(datos);current=0;for(const k of Object.keys(ads))delete ads[k];for(const [n,a] of Object.entries(datos)){if(+n>=1&&+n<=TOTAL*6&&validAd(a))ads[n]={name:String(a.name||'Publicidad'),image:a.image}}omitEmptyPages();render()}catch(e){console.info('No se pudo actualizar la revista',e)}}
function omitEmptyPages(){const oldTotal=TOTAL,next={},newLayouts={};let p=0;for(let i=0;i<oldTotal;i++){if(!Array.from({length:6},(_,j)=>ads[i*6+j+1]).some(Boolean))continue;for(let j=1;j<=6;j++){if(ads[i*6+j])next[p*6+j]=ads[i*6+j]}newLayouts[p+1]=layouts[i+1]||2;p++}for(const k of Object.keys(ads))delete ads[k];Object.assign(ads,next);layouts=newLayouts;TOTAL=p;current=Math.max(0,Math.min(current,pageTotal()-1))}

let soundEnabled=true;try{soundEnabled=localStorage.getItem('qc-page-sound')!=='off'}catch(_){}let audio=null;const soundButton=document.getElementById('sound');function soundLabel(){soundButton.textContent=soundEnabled?'Sonido ✓':'Sin sonido';soundButton.setAttribute('aria-pressed',String(soundEnabled))}soundLabel();soundButton.onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('qc-page-sound',soundEnabled?'on':'off')}catch(_){}soundLabel()};function paperSound(){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume().catch(()=>{});const duration=.25,buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*duration),audio.sampleRate),data=buffer.getChannelData(0);let smooth=0;for(let i=0;i<data.length;i++){smooth=.72*smooth+.28*(Math.random()*2-1);const t=i/data.length;data[i]=smooth*Math.sin(Math.PI*t)**2*(.75+.25*Math.sin(t*28))}const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1300;filter.Q.value=.65;gain.gain.value=.22;source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start()}catch(_){}}let activeLeaf=null;function move(d){const target=Math.max(0,Math.min(pageTotal()-1,current+d));if(target===current||modal.classList.contains("open"))return;if(activeLeaf)activeLeaf.remove();const leaf=sheet.cloneNode(true);leaf.querySelectorAll(".turn-leaf").forEach(e=>e.remove());leaf.removeAttribute("id");leaf.style.height=sheet.offsetHeight+"px";leaf.style.gridTemplateRows=getComputedStyle(sheet).gridTemplateRows;leaf.setAttribute("aria-hidden","true");leaf.classList.add("turn-leaf",d>0?"forward":"backward");leaf.querySelectorAll("img").forEach(im=>im.loading="eager");activeLeaf=leaf;current=target;paperSound();render();sheet.append(leaf);const finish=()=>{leaf.remove();if(activeLeaf===leaf)activeLeaf=null};leaf.addEventListener("animationend",finish,{once:true});setTimeout(finish,320)}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('close').onclick=()=>closeViewer();modal.onclick=e=>{if(e.target===modal)closeViewer()};function closeViewer(){modal.classList.remove("open");document.body.style.overflow="";zoom.replaceChildren()}let scale=1,dx=0,dy=0,gesture=null;function resetZoom(){scale=1;dx=dy=0;gesture=null;paintZoom()}function paintZoom(){const im=zoom.querySelector('img');if(im)im.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')'}function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}zoom.addEventListener('touchstart',e=>{gesture=e.touches.length===2?{dist:distance(e.touches),scale}:{x:e.touches[0].clientX,y:e.touches[0].clientY,dx,dy};},{passive:true});zoom.addEventListener('touchmove',e=>{if(!gesture)return;e.preventDefault();if(e.touches.length===2&&gesture.dist){scale=Math.max(1,Math.min(5,gesture.scale*distance(e.touches)/gesture.dist));if(scale===1)dx=dy=0}else if(e.touches.length===1&&gesture.x!==undefined&&scale>1){dx=gesture.dx+e.touches[0].clientX-gesture.x;dy=gesture.dy+e.touches[0].clientY-gesture.y;dx=Math.max(-zoom.clientWidth*(scale-1)/2,Math.min(zoom.clientWidth*(scale-1)/2,dx));dy=Math.max(-zoom.clientHeight*(scale-1)/2,Math.min(zoom.clientHeight*(scale-1)/2,dy))}paintZoom()},{passive:false});zoom.addEventListener('touchend',()=>gesture=null);zoom.addEventListener('dblclick',()=>{if(scale>1)resetZoom();else{scale=2;paintZoom()}});const preloaded=new Map();function preloadNeighbors(){for(const p of [current-1-(cover?1:0),current+1-(cover?1:0)]){if(p<0||p>=TOTAL)continue;for(let i=1;i<=6;i++){const a=ads[p*6+i];if(a&&!preloaded.has(a.image)){const im=new Image();im.src=a.image;preloaded.set(a.image,im)}}}while(preloaded.size>24)preloaded.delete(preloaded.keys().next().value)}let swipeAt=0;let start;sheet.addEventListener('touc
