<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12664b"><title>Revista | Quilmes Conectado</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1ef;color:#18382e;font:16px system-ui,sans-serif}header{background:#12664b;color:white;text-align:center;padding:16px}h1{font-size:1.2rem;margin:0}header p{margin:5px 0 0}main{max-width:800px;margin:auto;padding:12px}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}button{background:#12664b;border:0;border-radius:8px;color:#fff;padding:11px;font:inherit;cursor:pointer}button:disabled{opacity:.35}#counter{font-weight:700;text-align:center}.sheet{background:white;padding:7px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;aspect-ratio: .72;box-shadow:0 3px 16px #0002;touch-action:pan-y}.ad{min-width:0;min-height:0;background:#e9f2ed;border:1px dashed #b4c9bd;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:5px}.ad:nth-child(even){background:#f8eee3}.ad img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;background:white;cursor:zoom-in}.placeholder{font-size:clamp(10px,2.4vw,17px);line-height:1.4}.placeholder strong{display:block}.hint{text-align:center;color:#526b5e;font-size:13px}dialog{border:0;border-radius:10px;max-width:96vw;max-height:95vh;padding:12px}dialog::backdrop{background:#000c}dialog img{max-width:90vw;max-height:78vh;object-fit:contain;display:block}dialog button{margin-top:10px}footer{text-align:center;padding:20px;font-size:13px;color:#60766b}@media(max-width:400px){.nav button{padding:9px;font-size:14px}}
</style></head><body><header><h1>QUILMES CONECTADO</h1><p>Revista comercial · Edición de prueba</p></header><main><nav class="nav"><button id="prev">‹ Anterior</button><span id="counter">Hoja 1 de 25</span><button id="next">Siguiente ›</button></nav><div class="sheet" id="sheet"></div><p class="hint">Deslizá para cambiar de hoja. Tocá una publicidad para ampliarla.</p></main><footer>25 hojas · 150 espacios publicitarios</footer><dialog id="modal"><div id="zoom"></div><button id="close">Cerrar</button></dialog><script>
'use strict';const TOTAL=25,PER_PAGE=6;let current=0;const sheet=document.getElementById('sheet'),modal=document.getElementById('modal'),zoom=document.getElementById('zoom');
const ads={};
async function cargarPublicidades(){try{const respuesta=await fetch('./anuncios.json',{cache:'no-store'});if(!respuesta.ok)throw Error('Sin manifiesto');const datos=await respuesta.json();if(datos&&typeof datos==='object'){for(const [n,a] of Object.entries(datos)){if(+n>=1&&+n<=150&&a&&typeof a.image==='string'&&a.image.startsWith('anuncios/'))ads[n]={name:String(a.name||'Publicidad'),image:a.image}}render()}}catch(e){console.info('Todavía no hay anuncios publicados')}}
function render(){sheet.replaceChildren();for(let i=0;i<PER_PAGE;i++){const n=current*PER_PAGE+i+1,a=ads[n],slot=document.createElement('div');slot.className='ad';if(a&&a.image){const img=document.createElement('img');img.src=a.image;img.alt=a.name||'Publicidad '+n;img.loading='lazy';img.onclick=()=>{zoom.replaceChildren();const full=document.createElement('img');full.src=a.image;full.alt=img.alt;zoom.append(full);modal.showModal()};img.onerror=()=>{img.remove();slot.textContent='Publicidad '+String(n).padStart(3,'0')};slot.append(img)}else{const p=document.createElement('div');p.className='placeholder';const b=document.createElement('strong');b.textContent='Publicidad '+String(n).padStart(3,'0');p.append(b,document.createTextNode('Tu comercio puede estar acá'));slot.append(p)}sheet.append(slot)}document.getElementById('counter').textContent='Hoja '+(current+1)+' de '+TOTAL;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===TOTAL-1}
function move(d){current=Math.max(0,Math.min(TOTAL-1,current+d));render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close()};let start;sheet.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});sheet.addEventListener('touchend',e=>{if(start===undefined)return;const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>60)move(dx<0?1:-1);start=undefined},{passive:true});document.addEventListener('keydown',e=>{if(modal.open)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();cargarPublicidades();
</script></body></html>
